
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Samuel Davi</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5ead7;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.envelope{
position:relative;
width:320px;
height:220px;
cursor:pointer;
}

.base{
position:absolute;
width:100%;
height:100%;
background:#c89b5d;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.tampa{
position:absolute;
width:100%;
height:100%;
background:#b88747;
clip-path:polygon(0 0,100% 0,50% 55%);
transform-origin:top;
transition:1s;
z-index:2;
}

.texto{
position:absolute;
width:100%;
text-align:center;
top:90px;
font-size:22px;
font-weight:bold;
color:white;
z-index:3;
}

.aberto .tampa{
transform:rotateX(180deg);
}

.convite{
position:fixed;
inset:0;
background:#f5ead7;
display:none;
justify-content:center;
align-items:center;
padding:15px;
}

.convite img{
width:85%;
max-width:300px;

border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.botoes{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
}

.btn{
background:#25D366;
color:white;
padding:14px 24px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
</style>
</head>

<body>

<div class="envelope" id="envelope">
<div class="base"></div>
<div class="tampa"></div>
<div class="texto">Toque para abrir ✨</div>
</div>

<div class="convite" id="convite">
<img src="samuel.jpg" alt="Convite">
<div class="convite" id="convite">
    <img src="samuel.jpg" alt="Convite">
</div>
</div>

<script>
document.getElementById("envelope").onclick = function() {
    this.classList.add("aberto");

    setTimeout(() => {
        document.getElementById("envelope").style.display = "none";
        document.getElementById("convite").style.display = "flex";
    }, 900);
}
</script>

</body>
</html>
