<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Samuel Davi</title>

<style>
body{
margin:0;
background:#f7e7ce;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
}

.envelope{
width:320px;
height:220px;
background:#c89b5b;
position:relative;
cursor:pointer;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.tampa{
position:absolute;
top:0;
left:0;
width:100%;
height:100px;
background:#b88645;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;
}

.convite{
position:absolute;
top:20px;
left:10px;
right:10px;
bottom:10px;
background:white;
border-radius:10px;
padding:15px;
text-align:center;
transform:translateY(80px);
opacity:0;
transition:1s;
overflow:auto;
}

.aberto .tampa{
transform:rotateX(180deg);
}

.aberto .convite{
transform:translateY(-40px);
opacity:1;
}

h1{
color:#8b5a2b;
}

img{
width:100%;
border-radius:10px;
}
</style>
</head>

<body>

<div class="envelope" onclick="abrir()">
<div class="tampa"></div>

<div class="convite">
<h1>Samuel Davi</h1>

<img src="https://via.placeholder.com/300x400.png?text=Foto+Samuel+Davi">

<p><strong>Toque no envelope para abrir.</strong></p>

<p>Você está convidado para celebrar este momento especial.</p>
</div>
</div>

<script>
function abrir(){
document.querySelector('.envelope').classList.toggle('aberto');
}
</script>

</body>
</html>
