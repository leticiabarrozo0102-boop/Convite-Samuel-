<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá Rifa Samuel Davi</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#efe3d0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.envelope{
position:relative;
width:320px;
height:220px;
cursor:pointer;
transition:.8s;
}

.base{
position:absolute;
bottom:0;
width:100%;
height:170px;
background:#c89a57;
border-radius:0 0 12px 12px;
box-shadow:0 15px 30px rgba(0,0,0,.2);
}

.flap{
position:absolute;
top:0;
width:100%;
height:120px;
background:#b98542;
clip-path:polygon(0 0,50% 100%,100% 0);
transform-origin:top;
transition:1s;
z-index:3;
}

.texto{
position:absolute;
width:100%;
top:110px;
text-align:center;
font-size:20px;
font-weight:bold;
color:#6b4317;
z-index:4;
}

.convite{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
visibility:hidden;
transition:1s;
padding:15px;
overflow:auto;
}

.convite img{
width:100%;
max-width:700px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.aberto .flap{
transform:rotateX(180deg);
}

.aberto .convite{
opacity:1;
visibility:visible;
}

.botao{
margin-top:20px;
background:#25D366;
color:white;
padding:14px 25px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
font-size:18px;
}
</style>
</head>

<body>

<div class="envelope" id="env">

<div class="flap"></div>
<div class="base"></div>

<div class="texto">
📩 Toque para abrir
</div>

<div class="convite">

<img src="safari.jpg" alt="Chá Rifa Samuel Davi">

<a class="botao"
href="https://wa.me/?text=Participe%20do%20Chá%20Rifa%20do%20Samuel%20Davi!">
Compartilhar no WhatsApp
</a>

</div>

</div>

<script>
document.getElementById("env").onclick=function(){
this.classList.add("aberto");
}
</script>

</body>
</html>
